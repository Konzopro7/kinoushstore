{% extends "admin/base_site.html" %}
{% block content %}
<div id="content-main">
  <h1>Vérification en deux étapes</h1>
  <p>Saisissez le code à 6 chiffres de votre application d’authentification. Un code de récupération à usage unique est également accepté.</p>
  <form method="post">{% csrf_token %}<div class="form-row"><label for="id_code">Code :</label><input id="id_code" name="code" inputmode="numeric" autocomplete="one-time-code" autofocus required></div><div class="submit-row"><input type="submit" value="Se connecter" /></div></form>
</div>
{% endblock %}
